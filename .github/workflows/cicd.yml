name: UI API CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_tag:
        description: "Optional deployment tag (example: dev-1.0.0)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write

env:
  TF_WORKING_DIR: terraform
  UI_WORKING_DIR: ui
  API_WORKING_DIR: api

  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
  API_APP_NAME: app-api-cicd

  VAULT_ADDR: https://172.198.74.239:8200
  VAULT_ROLE: ui-api-cicd
  VAULT_SECRET_PATH: cicd/data/ui-api-cicd

jobs:

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve


  vault-version:
    name: Get Version From Vault
    runs-on: ubuntu-latest
    needs: terraform

    outputs:
      version: ${{ steps.version.outputs.version }}
      deployment_tag: ${{ steps.version.outputs.deployment_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Vault using GitHub OIDC
        uses: hashicorp/vault-action@v3
        id: vault
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: https://github.com/harikrishna0991/UI-API-CICD
          caCertificate: ${{ vars.VAULT_CA_CERT }}
          secrets: |
            ${{ env.VAULT_SECRET_PATH }} version | VERSION

      - name: Determine Deployment Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.deployment_tag }}" ]; then
            DEPLOYMENT_TAG="${{ github.event.inputs.deployment_tag }}"
            VERSION="${DEPLOYMENT_TAG#dev-}"
          else
            VERSION="${VERSION}"
            DEPLOYMENT_TAG="dev-${VERSION}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Vault version is empty."
            exit 1
          fi

          echo "Version: ${VERSION}"
          echo "Deployment tag: ${DEPLOYMENT_TAG}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deployment_tag=${DEPLOYMENT_TAG}" >> "$GITHUB_OUTPUT"


  detect-changes:
    name: Detect UI API Changes
    runs-on: ubuntu-latest
    needs: vault-version

    outputs:
      ui_changed: ${{ steps.changes.outputs.ui_changed }}
      api_changed: ${{ steps.changes.outputs.api_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Detect Changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.deployment_tag }}" ]; then
            echo "Manual tag deployment selected."
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          UI_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^ui/' || true)
          API_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^api/' || true)

          if [ -n "$UI_CHANGED" ]; then
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$API_CHANGED" ]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
          fi


  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm ci

      - name: Build UI
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm run build


  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet publish --configuration Release --output ./publish --no-restore


  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-ui
      - vault-version

    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm ci

      - name: Build UI
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UI to Azure Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ env.AZURE_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source "${{ env.UI_WORKING_DIR }}/dist" \
            --overwrite \
            --auth-mode login


  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-api
      - vault-version

    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet restore

      - name: Publish
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet publish --configuration Release --output ./publish --no-restore

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: ${{ env.API_WORKING_DIR }}/publish


  create-release-tag:
    name: Create Deployment Tag
    runs-on: ubuntu-latest

    needs:
      - vault-version
      - detect-changes
      - deploy-ui
      - deploy-api

    if: |
      always() &&
      needs.vault-version.result == 'success' &&
      (
        needs.deploy-ui.result == 'success' ||
        needs.deploy-api.result == 'success'
      ) &&
      github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Deployment Tag
        shell: bash
        run: |
          TAG="${{ needs.vault-version.outputs.deployment_tag }}"

          if [ -z "${TAG}" ]; then
            echo "ERROR: Deployment tag is empty."
            exit 1
          fi

          echo "Creating deployment tag: ${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${TAG}"
          git push origin "${TAG}"


  update-vault-version:
    name: Update Vault Version
    runs-on: ubuntu-latest

    needs:
      - vault-version
      - create-release-tag

    if: |
      needs.create-release-tag.result == 'success' &&
      github.event_name == 'push'

    steps:
      - name: Login to Vault using GitHub OIDC
        uses: hashicorp/vault-action@v3
        id: vault
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: https://github.com/harikrishna0991/UI-API-CICD
          caCertificate: ${{ vars.VAULT_CA_CERT }}
          exportToken: true
          secrets: |
            ${{ env.VAULT_SECRET_PATH }} version | CURRENT_VERSION

      - name: Calculate Next Version
        id: next
        shell: bash
        run: |
          CURRENT_VERSION="${CURRENT_VERSION}"

          if [ -z "${CURRENT_VERSION}" ]; then
            echo "ERROR: Current Vault version is empty."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"

          NEXT_PATCH=$((PATCH + 1))

          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "Current version: ${CURRENT_VERSION}"
          echo "Next version: ${NEXT_VERSION}"

          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Write Next Version To Vault
        env:
          VAULT_TOKEN: ${{ steps.vault.outputs.vault_token }}
        shell: bash
        run: |
          CA_FILE=$(mktemp)

          echo "${{ vars.VAULT_CA_CERT }}" | base64 -d > "${CA_FILE}"

          echo "Updating Vault version to ${{ steps.next.outputs.next_version }}"

          curl \
            --fail \
            --request POST \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"data\":{\"version\":\"${{ steps.next.outputs.next_version }}\"}}" \
            --cacert "${CA_FILE}" \
            "${{ env.VAULT_ADDR }}/v1/cicd/data/ui-api-cicd"

          rm -f "${CA_FILE}"

          echo "Vault version updated successfully."