name: UI API CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_tag:
        description: "Optional deployment tag (example: dev-1.0.0)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write

env:
  TF_WORKING_DIR: terraform
  UI_WORKING_DIR: ui
  API_WORKING_DIR: api

  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
  API_APP_NAME: app-api-cicd

  VAULT_ADDR: https://172.198.74.239:8200
  VAULT_ROLE: ui-api-cicd
  VAULT_SECRET_PATH: cicd/data/ui-api-cicd

jobs:

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve


  vault-version:
    name: Get Version From Vault
    runs-on: ubuntu-latest
    needs: terraform

    outputs:
      version: ${{ steps.version.outputs.version }}
      deployment_tag: ${{ steps.version.outputs.deployment_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Vault using GitHub OIDC
        uses: hashicorp/vault-action@v3
        id: vault
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: https://github.com/harikrishna0991/UI-API-CICD
          caCertificate: ${{ vars.VAULT_CA_CERT }}
          exportToken: true

      - name: Read Version From Vault
        id: version
        shell: bash
        env:
          VAULT_TOKEN: ${{ steps.vault.outputs.vault_token }}
          VAULT_CA_CERT: ${{ vars.VAULT_CA_CERT }}
          INPUT_TAG: ${{ github.event.inputs.deployment_tag }}
        run: |
          set -e

          echo "========================================"
          echo "Reading Version From Vault"
          echo "========================================"

          if [ -z "${VAULT_TOKEN}" ]; then
            echo "ERROR: Vault token is empty."
            exit 1
          fi

          echo "${VAULT_CA_CERT}" | base64 -d > vault-ca.crt

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --cacert vault-ca.crt \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/cicd/data/ui-api-cicd")

          echo "Vault response received successfully."

          VERSION_FROM_VAULT=$(echo "${RESPONSE}" | jq -r '.data.data.version')

          if [ "${VERSION_FROM_VAULT}" = "null" ] || [ -z "${VERSION_FROM_VAULT}" ]; then
            echo "ERROR: Version was not found in Vault."
            exit 1
          fi

          echo "Vault Version: ${VERSION_FROM_VAULT}"
          echo "Manual Deployment Tag: ${INPUT_TAG}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            DEPLOYMENT_TAG="${INPUT_TAG}"
            VERSION="${DEPLOYMENT_TAG#dev-}"
          else
            VERSION="${VERSION_FROM_VAULT}"
            DEPLOYMENT_TAG="dev-${VERSION}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Version is empty."
            exit 1
          fi

          if [ -z "${DEPLOYMENT_TAG}" ]; then
            echo "ERROR: Deployment tag is empty."
            exit 1
          fi

          echo "========================================"
          echo "Final Version: ${VERSION}"
          echo "Final Deployment Tag: ${DEPLOYMENT_TAG}"
          echo "========================================"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deployment_tag=${DEPLOYMENT_TAG}" >> "$GITHUB_OUTPUT"


  detect-changes:
    name: Detect UI API Changes
    runs-on: ubuntu-latest
    needs: vault-version

    outputs:
      ui_changed: ${{ steps.changes.outputs.ui_changed }}
      api_changed: ${{ steps.changes.outputs.api_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Detect Changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.deployment_tag }}" ]; then
            echo "Manual tag deployment selected."

            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
            echo "api_changed=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          echo "========================================"
          echo "Changed files:"
          echo "${CHANGED_FILES}"
          echo "========================================"

          UI_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^ui/' || true)
          API_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^api/' || true)

          if [ -n "$UI_CHANGED" ]; then
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
            echo "UI changes detected."
          else
            echo "ui_changed=false" >> "$GITHUB_OUTPUT"
            echo "No UI changes detected."
          fi

          if [ -n "$API_CHANGED" ]; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
            echo "API changes detected."
          else
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
            echo "No API changes detected."
          fi


  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm ci

      - name: Build UI
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm run build


  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet publish --configuration Release --output ./publish --no-restore


  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-ui
      - vault-version

    if: needs.detect-changes.outputs.ui_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm ci

      - name: Build UI
        working-directory: ${{ env.UI_WORKING_DIR }}
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UI to Azure Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ env.AZURE_STORAGE_ACCOUNT }}" \
            --destination '$web' \
            --source "${{ env.UI_WORKING_DIR }}/dist" \
            --overwrite \
            --auth-mode login


  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - build-api
      - vault-version

    if: needs.detect-changes.outputs.api_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet restore

      - name: Publish
        working-directory: ${{ env.API_WORKING_DIR }}
        run: dotnet publish --configuration Release --output ./publish --no-restore

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: ${{ env.API_WORKING_DIR }}/publish


  create-release-tag:
    name: Create Deployment Tag
    runs-on: ubuntu-latest

    needs:
      - vault-version
      - detect-changes
      - deploy-ui
      - deploy-api

    if: |
      always() &&
      needs.vault-version.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.ui_changed == 'true' ||
        needs.detect-changes.outputs.api_changed == 'true'
      ) &&
      (
        needs.deploy-ui.result == 'success' ||
        needs.deploy-api.result == 'success'
      ) &&
      github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Deployment Tag
        shell: bash
        env:
          DEPLOYMENT_TAG: ${{ needs.vault-version.outputs.deployment_tag }}
          VERSION: ${{ needs.vault-version.outputs.version }}
        run: |
          echo "========================================"
          echo "Version: ${VERSION}"
          echo "Deployment Tag: ${DEPLOYMENT_TAG}"
          echo "========================================"

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Version output is empty."
            exit 1
          fi

          if [ -z "${DEPLOYMENT_TAG}" ]; then
            echo "ERROR: Deployment tag output is empty."
            exit 1
          fi

      - name: Check Existing Deployment Tag
        shell: bash
        env:
          DEPLOYMENT_TAG: ${{ needs.vault-version.outputs.deployment_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${DEPLOYMENT_TAG}" > /dev/null 2>&1; then
            echo "ERROR: Deployment tag ${DEPLOYMENT_TAG} already exists."
            echo "The Vault version may already have been used."
            exit 1
          fi

          echo "Tag ${DEPLOYMENT_TAG} does not exist. Continuing."

      - name: Create Deployment Tag
        shell: bash
        env:
          DEPLOYMENT_TAG: ${{ needs.vault-version.outputs.deployment_tag }}
        run: |
          echo "Creating deployment tag: ${DEPLOYMENT_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${DEPLOYMENT_TAG}"
          git push origin "${DEPLOYMENT_TAG}"

          echo "Deployment tag created successfully: ${DEPLOYMENT_TAG}"


  update-vault-version:
    name: Update Vault Version
    runs-on: ubuntu-latest

    needs:
      - vault-version
      - detect-changes
      - deploy-ui
      - deploy-api
      - create-release-tag

    if: |
      always() &&
      needs.vault-version.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      needs.create-release-tag.result == 'success' &&
      (
        needs.detect-changes.outputs.ui_changed == 'true' ||
        needs.detect-changes.outputs.api_changed == 'true'
      ) &&
      (
        needs.deploy-ui.result == 'success' ||
        needs.deploy-api.result == 'success'
      ) &&
      github.event_name == 'push'

    steps:
      - name: Login to Vault using GitHub OIDC
        uses: hashicorp/vault-action@v3
        id: vault
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: https://github.com/harikrishna0991/UI-API-CICD
          caCertificate: ${{ vars.VAULT_CA_CERT }}
          exportToken: true

      - name: Read Current Version From Vault
        id: current
        shell: bash
        env:
          VAULT_TOKEN: ${{ steps.vault.outputs.vault_token }}
          VAULT_CA_CERT: ${{ vars.VAULT_CA_CERT }}
        run: |
          set -e

          echo "========================================"
          echo "Reading Current Vault Version"
          echo "========================================"

          if [ -z "${VAULT_TOKEN}" ]; then
            echo "ERROR: Vault token is empty."
            exit 1
          fi

          echo "${VAULT_CA_CERT}" | base64 -d > vault-ca.crt

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --cacert vault-ca.crt \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/cicd/data/ui-api-cicd")

          CURRENT_VERSION=$(echo "${RESPONSE}" | jq -r '.data.data.version')

          if [ "${CURRENT_VERSION}" = "null" ] || [ -z "${CURRENT_VERSION}" ]; then
            echo "ERROR: Current Vault version is empty."
            exit 1
          fi

          echo "Current Vault Version: ${CURRENT_VERSION}"

          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Calculate Next Version
        id: next
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.current_version }}
        run: |
          set -e

          echo "========================================"
          echo "Calculating Next Version"
          echo "Current Version: ${CURRENT_VERSION}"
          echo "========================================"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"

          if [ -z "${MAJOR}" ] || [ -z "${MINOR}" ] || [ -z "${PATCH}" ]; then
            echo "ERROR: Invalid semantic version: ${CURRENT_VERSION}"
            exit 1
          fi

          if ! [[ "${MAJOR}" =~ ^[0-9]+$ ]] || \
             ! [[ "${MINOR}" =~ ^[0-9]+$ ]] || \
             ! [[ "${PATCH}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid semantic version: ${CURRENT_VERSION}"
            exit 1
          fi

          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "Next Version: ${NEXT_VERSION}"

          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Write Next Version To Vault
        env:
          VAULT_TOKEN: ${{ steps.vault.outputs.vault_token }}
          VAULT_CA_CERT: ${{ vars.VAULT_CA_CERT }}
          NEXT_VERSION: ${{ steps.next.outputs.next_version }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Updating Vault"
          echo "New Version: ${NEXT_VERSION}"
          echo "========================================"

          if [ -z "${VAULT_TOKEN}" ]; then
            echo "ERROR: Vault token is empty."
            exit 1
          fi

          if [ -z "${NEXT_VERSION}" ]; then
            echo "ERROR: Next version is empty."
            exit 1
          fi

          echo "${VAULT_CA_CERT}" | base64 -d > vault-ca.crt

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"data\":{\"version\":\"${NEXT_VERSION}\"}}" \
            --cacert vault-ca.crt \
            "${VAULT_ADDR}/v1/cicd/data/ui-api-cicd"

          echo "========================================"
          echo "Vault version updated successfully."
          echo "New Version: ${NEXT_VERSION}"
          echo "========================================"